<!doctype html><html lang="ko" data-mode="orb"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrbBridge · ORB</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ok:#4ade80;--warn:#facc15;--err:#f87171;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
header h1{font-weight:600}header h1 span{color:var(--muted);font-weight:400}
.status-bar,.links{display:flex;align-items:center}.links a{text-decoration:none}
button{font:inherit;background:var(--surface2);color:var(--ink);border:1px solid var(--border)}
.toolbar{display:flex;align-items:center}.pill{padding:6px 10px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-size:12px}
</style>
<link rel="stylesheet" href="/admin/operator.css">
<style>
.orb-content{max-width:1600px;margin:auto;padding:0 28px 28px;width:100%}
.orb-content .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px}
.orb-content h2{font-size:17px;font-weight:600;margin-bottom:12px}
.orb-content p,.small{color:var(--muted);font-size:12px;line-height:1.7}
.orb-content .toolbar{margin-bottom:16px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stats>div{background:#101925;border:1px solid #223148;border-radius:10px;padding:12px}.stats b{display:block;font-size:24px}.stats span{font-size:11px;color:var(--muted)}
.board-scroll{margin-top:12px}.board{display:grid;grid-template-columns:repeat(6,94px);gap:6px;width:max-content}
.module{display:grid;grid-template-columns:44px 44px;gap:6px}.module-label{grid-column:span 2;text-align:center;color:var(--accent);font-size:12px;font-weight:600;padding:4px 0;border-bottom:2px solid var(--accent);margin-bottom:4px}
button.slot{padding:2px;width:44px;height:44px;min-height:0;border-radius:8px;font-size:10px;background:var(--empty);color:var(--muted);border:1.5px solid var(--border)}
button.slot.lit{background:rgba(255,147,41,.22);color:#ffd1a3;border-color:#dc9a57}
button.slot.unknown{background:rgba(250,204,21,.2);color:var(--warn);border-color:var(--warn)}
button.slot.offline{border-style:dashed;border-color:var(--err);color:var(--err)}
button.slot.selected{outline:2px solid var(--accent);outline-offset:2px}
.artists{max-height:480px;overflow:auto;margin-top:12px}.artist{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);font-size:12px}.dots{color:var(--accent);white-space:nowrap}
label{display:block;margin:14px 0 6px;font-size:12px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.list{max-height:230px;overflow:auto}.row{padding:9px 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere;font-size:12px}
.error{color:var(--err)}.error:not(:empty){padding:10px;background:#302027;border:1px solid #673d46;border-radius:8px;margin-bottom:12px}
#detail{overflow-wrap:anywhere;margin-top:14px;background:#101925;padding:16px;border-radius:10px;font-size:12px}
progress{display:block;width:100%;height:6px;accent-color:var(--accent)}
[aria-label="오브 버전"] button[aria-pressed="true"]{opacity:1;background:var(--accent);color:#101925;border-color:var(--accent)}
@media(max-width:1050px){.orb-content{padding:0 20px 20px}.layout{grid-template-columns:1fr}}
@media(max-width:600px){.orb-content{padding:0 14px 20px}.formgrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.orb-content .panel{padding:16px}}
</style>
<body>
<header><h1>OrbBridge <span>ORB Admin</span></h1><div class="status-bar"><div class="links"><a href="/admin" target="_top" data-control-mode="hardware">Hardware</a><a href="/admin/software" target="_top" data-control-mode="software">Software</a><a href="/admin/orb" target="_top" data-control-mode="orb">ORB</a></div></div></header>
<div class="page-intro"><div><span class="intro-tag">ORBBRIDGE / CONTROL ROOM</span><h2>오브 점검 & 등록</h2></div></div>
<div class="orb-content">
<section class="panel"><h2>오브 버전</h2><div class="toolbar" role="group" aria-label="오브 버전"><button id="version-original" aria-pressed="true">오리지널 버전</button><button id="version-male" aria-pressed="false">남자 아이돌 버전</button></div><p id="version-info"></p></section>
<div class="toolbar"><span id="mode" class="pill">대기</span><button class="primary" id="auto-start">등록 시작</button><button id="auto-stop">자동 등록 중지</button><button id="start">점검 시작</button><button id="pause">일시정지</button><button id="finish">점검 종료</button><button id="export">결과 저장</button></div>
<div class="panel" id="registration-status" hidden><p id="auto-status" aria-live="polite"></p><div id="auto-recent" class="list"></div></div>
<div id="error" class="error" role="alert"></div><div class="stats"><div><b id="total">0</b><span>등록 대상</span></div><div><b id="seen">0</b><span>누적 확인</span></div><div><b id="missing">0</b><span>미확인</span></div><div><b id="current">0</b><span>현재 인식</span></div></div><progress id="progress" value="0" max="1"></progress>
<div class="layout" style="margin-top:24px"><section class="panel"><h2>실시간 테이블 · 96 슬롯</h2><p class="small">점검 시작 후 오브를 뺐다가 다시 올려 주세요.<br>주황: 등록 · 노랑: 미등록 · 점선: 연결 미확인</p><div class="board-scroll"><div id="board" class="board"></div></div><div id="detail">슬롯을 선택하세요.</div></section>
<section class="panel"><h2>아티스트별 누적 확인</h2><input id="search" placeholder="아티스트 / 음성 검색" aria-label="아티스트 검색"><div id="artists" class="artists"></div></section></div>
<section class="panel"><h2>ID 등록 · 교체</h2><p class="small">미등록 오브의 슬롯을 선택하세요.</p><div class="formgrid"><div><label for="newid">선택한 오브 ID</label><input id="newid" readonly><label for="voice">배정할 아티스트 / 음성</label><select id="voice"></select><button id="register" class="primary" style="margin-top:12px">새 ID 등록</button></div><div><label for="oldid">교체할 기존 ID</label><select id="oldid"></select><button id="replace">기존 ID 교체</button></div></div></section>
<section class="panel"><h2>미확인 ID</h2><p class="small">이번 점검에서 아직 읽히지 않은 오브입니다.</p><div id="missingList" class="list"></div></section>
</div>
<script>
const $=id=>document.getElementById(id);let state=null,catalog={},selected=null,busy=false;
const label=v=>catalog[v] ? `${catalog[v]} · ${v}` : v;
function el(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
for(let s=1;s<=6;s++){const m=el('div','','module');m.append(el('div',`SLAVE ${s}`,'module-label'));for(let r=1;r<=8;r++)for(let c of [r,r+8]){const b=el('button',`${s}:${c}`,'slot');b.id=`slot-${s}-${c}`;b.onclick=()=>{selected=[s,c];render()};m.append(b)}$('board').append(m)}
function options(id,items){const e=$(id),value=e.value,signature=JSON.stringify(items);if(e.dataset.signature===signature)return;e.dataset.signature=signature;e.replaceChildren(...items.map(([v,t])=>{const o=el('option',t);o.value=v;return o}));if(items.some(x=>x[0]===value))e.value=value}
function render(){if(!state)return;catalog={};for(const [v,p] of Object.entries(state.voices||{}))catalog[v]=p.labels?.kr||p.labels?.en||v;const active=['running','paused'].includes(state.mode),seen=new Set(state.seen),entries=Object.entries(state.mapping),known=entries.filter(([id])=>seen.has(id.toUpperCase())).length;
for(const version of ['original','male']){const b=$('version-'+version),chosen=state.version===version;b.setAttribute('aria-pressed',String(chosen));b.classList.toggle('primary',chosen);b.disabled=busy||chosen;}$('version-info').textContent=Object.keys(catalog).length+'명 · 목표 '+state.target_count+'개';
$('auto-start').disabled=busy||state.auto_register;$('auto-stop').disabled=busy||!state.auto_register;$('auto-status').textContent=state.auto_error||(state.auto_register?((state.mode==='paused'?'자동 등록 일시정지':'자동 등록 중')+' · 다음: '+label(state.auto_next||'완료')):state.auto_target?'자동 등록 중지 / 완료':'');$('registration-status').hidden=!(state.auto_register||state.auto_error||(state.auto_recent||[]).length);$('auto-recent').replaceChildren(...(state.auto_recent||[]).map(x=>el('div',label(x.voice)+' ← '+x.id,'row')));
$('mode').textContent={idle:'대기',running:'점검 중 · 게임 중단',paused:'일시정지 · 게임 중단',finished:'점검 종료'}[state.mode];$('start').disabled=active||busy;$('pause').disabled=!active||busy;$('finish').disabled=!active||busy;$('pause').textContent=state.mode==='paused'?'계속 점검':'일시정지';$('total').textContent=entries.length;$('seen').textContent=known;$('missing').textContent=state.missing.length;$('current').textContent=state.cells.length;$('progress').max=Math.max(1,entries.length);$('progress').value=known;
for(let s=1;s<=6;s++)for(let c=1;c<=16;c++){const b=$(`slot-${s}-${c}`),orb=state.cells.find(x=>x.slave===s&&x.cell===c),online=state.slaves.find(x=>x.slave===s)?.online;b.className='slot'+(!online?' offline':orb?(state.mapping[orb.id]?' lit':' unknown'):'')+(selected?.[0]===s&&selected?.[1]===c?' selected':'');b.title=!online?'통신 미확인':orb?.id||'ID 미인식'}
const orb=selected&&state.cells.find(x=>x.slave===selected[0]&&x.cell===selected[1]);$('newid').value=orb?.id||'';$('detail').textContent=orb?`${orb.slave}:${orb.cell} | ${orb.id} | ${label(state.mapping[orb.id]?.voice||'미등록')}`:selected?`${selected.join(':')} · ID를 읽지 못했습니다`:'슬롯을 선택하세요';$('register').disabled=$('replace').disabled=!active||!orb||!!state.mapping[orb.id]||busy||state.auto_register;
const voices=[...new Set([...Object.keys(catalog),...entries.map(x=>x[1].voice)])].sort();options('voice',voices.map(v=>[v,label(v)]));options('oldid',[['','기존 ID 선택'],...entries.sort((a,b)=>Number(seen.has(a[0]))-Number(seen.has(b[0]))).map(([id,v])=>[id,`${seen.has(id)?'확인':'미확인'} · ${label(v.voice)} · ${id}`])]);
$('artists').replaceChildren();for(const v of voices){if(!label(v).toLowerCase().includes($('search').value.toLowerCase()))continue;const ids=entries.filter(x=>x[1].voice===v).map(x=>x[0]),n=ids.filter(id=>seen.has(id.toUpperCase())).length,row=el('div','','artist');row.append(el('span',label(v)),el('span',`${'●'.repeat(Math.min(n,ids.length))}${'○'.repeat(Math.max(0,ids.length-n))} ${n}/${ids.length} 확인`,'dots'));$('artists').append(row)}
$('missingList').replaceChildren(...state.missing.map(id=>el('div',`${label(state.mapping[id].voice)} · ${id}`,'row')));}
async function refresh(){try{const r=await fetch('/api/admin/orb');if(!r.ok)throw Error('서버 연결 실패');state=await r.json();render()}catch(e){$('error').textContent='서버 연결 끊김 · 표시된 누적 기록은 유지됩니다';if(state){state.cells=[];state.slaves=state.slaves.map(s=>({...s,online:false}));render()}}}
async function action(action,extra={}){busy=true;render();try{const r=await fetch('/api/admin/orb',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra})}),d=await r.json();if(!r.ok)throw Error(d.error||'처리 실패');$('error').textContent='';await refresh()}catch(e){$('error').textContent=e.message}finally{busy=false;render()}}
for(const version of ['original','male'])$('version-'+version).onclick=()=>{if(confirm('게임을 중단하고 선택한 버전으로 전환합니다. 기존 배정은 보존되며 점검 기록은 초기화됩니다. 계속할까요?'))action('select_version',{version})};
$('auto-start').onclick=()=>action('auto_start');$('auto-stop').onclick=()=>action('auto_stop');
$('start').onclick=()=>{if(confirm('모든 게임과 재생을 중단하고 새 점검을 시작합니다. 이전 누적 기록은 초기화됩니다. 계속할까요?'))action('start')};$('pause').onclick=()=>action(state.mode==='paused'?'resume':'pause');$('finish').onclick=()=>action('finish');$('register').onclick=()=>action('register',{id:$('newid').value,voice:$('voice').value});$('replace').onclick=()=>{if($('oldid').value&&confirm('선택한 기존 ID를 새 ID로 교체하고 음성 배정을 이전할까요?'))action('register',{id:$('newid').value,replace_id:$('oldid').value})};$('search').oninput=render;
$('export').onclick=()=>{if(!state)return;const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a','');a.href=url;a.download='orb-inspection-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url)};
(async()=>{try{const d=await(await fetch('/api/voices')).json();for(const v of d.voices)catalog[v.name]=v.labels?.kr||v.labels?.en||v.name}catch{}await refresh();setInterval(refresh,1000)})();
</script></body></html>
