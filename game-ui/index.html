<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Orb — Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/screen/css/main.css">
</head>
<body>
  <span id="conn-dot" class="conn-dot" title="Disconnected" aria-label="Disconnected"></span>

  <section id="view-start" class="view view-start active">
    <div class="start-shell">
      <h1 class="start-title">Voice Orb</h1>
      <button type="button" class="btn btn-enter" id="btn-enter">start</button>
    </div>
  </section>

  <section id="view-play" class="view">
    <div class="staff-stage">
      <div class="staff-frame">
        <svg id="staff-glow" class="staff-glow" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <g id="path-layer"></g>
        </svg>
        <div id="glow-blob-layer" class="glow-blob-layer" aria-hidden="true"></div>
        <canvas id="staff-canvas"></canvas>
      </div>
    </div>
  </section>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <script type="module" src="/screen/js/app.js"></script>
</body>
</html>
