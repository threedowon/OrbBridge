<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrbBridge — Screen + Table</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0f1117;
    }

    main {
      width: min(100vw, calc(100vh * 8 / 9));
      height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 1px;
      background: #cfd2d8;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .screen { background: #f5f2e9; }
    .table { background: #f3f3f3; }
  </style>
</head>
<body>
  <main>
    <iframe class="screen" src="/screen" title="관객 화면"></iframe>
    <iframe class="table" src="/admin/table/" title="테이블 시뮬레이터"></iframe>
  </main>
</body>
</html>
