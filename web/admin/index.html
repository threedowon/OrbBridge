<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrbBridge — Software Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #0f1117;
      --gap: 8px;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
    }

    .workspace {
      width: 100%;
      height: 100%;
      padding: var(--gap);
      display: grid;
      grid-template-columns: minmax(620px, 1.35fr) minmax(420px, 0.65fr);
      gap: var(--gap);
    }

    .display {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 1px;
      overflow: hidden;
      border-radius: 6px;
      background: #cfd2d8;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .screen { background: #f5f2e9; }
    .table { background: #f3f3f3; }
    .control { min-width: 0; min-height: 0; background: var(--bg); }

    @media (max-width: 1100px) {
      html, body { overflow: auto; }
      .workspace {
        height: auto;
        grid-template-columns: 1fr;
      }
      .display { height: 900px; }
      .control { height: 760px; }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <section class="display">
      <iframe class="screen" src="/screen" title="관객 화면"></iframe>
      <iframe class="table" src="/admin/table/" title="테이블 시뮬레이터"></iframe>
    </section>
    <iframe
      class="control"
      src="/admin/control/?mode=software"
      title="소프트웨어 관리자 제어"
    ></iframe>
  </main>
</body>
</html>
